<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form action="#" method="post">

        <label for="name">Name:</label>
        <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Enter your name"
            required
        >
        <br><br>

        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            required
        >
        <br><br>

        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required
        >
        <br><br>

        <label>Gender:</label>

        <input 
            type="radio" 
            id="male" 
            name="gender" 
            value="male"
            required
        >
        <label for="male">Male</label>

        <input 
            type="radio" 
            id="female" 
            name="gender" 
            value="female"
        >
        <label for="female">Female</label>

        <input 
            type="radio" 
            id="other" 
            name="gender" 
            value="other"
        >
        <label for="other">Other</label>

        <br><br>

        <label>Hobbies:</label>

        <input 
            type="checkbox" 
            id="coding" 
            name="hobbies" 
            value="coding"
        >
        <label for="coding">Coding</label>

        <input 
            type="checkbox" 
            id="sports" 
            name="hobbies" 
            value="sports"
        >
        <label for="sports">Sports</label>

        <input 
            type="checkbox" 
            id="music" 
            name="hobbies" 
            value="music"
        >
        <label for="music">Music</label>

        <br><br>

       
        <label for="age">Age:</label>
        <input 
            type="number" 
            id="age" 
            name="age" 
            placeholder="Enter your age"
            min="18"
            max="100"
            required
        >
        <br><br>

        
        <input type="submit" value="Register">

    </form>

</body>

</html>
